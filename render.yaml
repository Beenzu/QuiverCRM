services:
  - type: web
    name: quivercrm
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_KEY
        sync: false
      - key: INTEGRATION_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: quivercrm-data
      mountPath: /var/data
      sizeGB: 1
